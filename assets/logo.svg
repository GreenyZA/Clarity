<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#1a1e2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6dd5ed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#6dd5ed" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
  </g>

  <!-- Logo mark - large -->
  <rect x="170" y="180" width="260" height="260" rx="24" ry="24" fill="#111420" stroke="url(#accentGrad)" stroke-width="3"/>

  <!-- CLARITY text -->
  <text x="300" y="315" text-anchor="middle" font-family="monospace" font-weight="800" font-size="48" fill="url(#accentGrad)" letter-spacing="6">CLARITY</text>

  <!-- Decorative lines under logo -->
  <line x1="210" y1="340" x2="390" y2="340" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  <line x1="230" y1="355" x2="370" y2="355" stroke="url(#accentGrad2)" stroke-width="1.5" opacity="0.4"/>

  <!-- Tagline -->
  <text x="300" y="420" text-anchor="middle" font-family="sans-serif" font-weight="400" font-size="22" fill="#9aa5c0" letter-spacing="2">TRAINING · AI · IT</text>

  <!-- Domain -->
  <text x="300" y="460" text-anchor="middle" font-family="monospace" font-weight="400" font-size="18" fill="#6dd5ed" letter-spacing="1">goclarity.co.za</text>

  <!-- South Africa marker -->
  <text x="300" y="500" text-anchor="middle" font-family="sans-serif" font-weight="300" font-size="14" fill="#34d399" letter-spacing="1">SOUTH AFRICA</text>

  <!-- Decorative corner elements -->
  <g opacity="0.3" stroke="#6dd5ed" stroke-width="1.5" fill="none">
    <polyline points="40,40 40,80 80,80"/>
    <polyline points="560,40 560,80 520,80" transform="rotate(90, 560, 40)"/>
    <polyline points="560,560 560,520 520,520"/>
    <polyline points="40,560 40,520 80,520" transform="rotate(-90, 40, 560)"/>
  </g>

  <!-- Small logo refines at bottom -->
  <g transform="translate(230, 530)">
    <rect x="0" y="0" width="140" height="40" rx="6" ry="6" fill="#1a1e2e" stroke="url(#accentGrad)" stroke-width="1.5"/>
    <text x="70" y="26" text-anchor="middle" font-family="monospace" font-weight="700" font-size="16" fill="url(#accentGrad)" letter-spacing="2">C</text>
  </g>

  <!-- Optical centre dot -->
  <circle cx="300" cy="300" r="2" fill="#6dd5ed" opacity="0.8"/>
  <circle cx="300" cy="300" r="8" fill="none" stroke="#6dd5ed" stroke-width="0.5" opacity="0.3"/>
  <circle cx="300" cy="300" r="20" fill="none" stroke="#6dd5ed" stroke-width="0.3" opacity="0.15"/>
</svg>
